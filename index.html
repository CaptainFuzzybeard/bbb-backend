<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Baaja Baraat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────── */
:root {
  --bg:       #FFFFFF;
  --surface:  #F9F9F9;
  --warm:     #F4F4F4;
  --border:   #E5E5E5;
  --line:     #D0D0D0;
  --ink:      #111111;
  --ink2:     #333333;
  --muted:    #888888;
  --light:    #BBBBBB;
  --saffron:  #E8642A;
  --saffron2: #CF5522;
  --sage:     #2A6448;
  --coral:    #C0392B;
  --gold:     #A07010;
  --r-sm:     8px;
  --r-md:     12px;
  --r-lg:     16px;
  --r-pill:   999px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.05);
  --shadow-saffron: 0 4px 16px rgba(232,100,42,.30);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

/* ─── LANDING ─────────────────────────────── */
#landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 72px 24px 96px;
  background: var(--bg);
}

.logo {
  width: min(460px, 90vw);
  display: block;
  margin: 0 auto 8px;
  animation: fadeUp .6s ease both;
}

.tagline {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: .01em;
  text-transform: none;
  color: var(--muted);
  text-align: center;
  margin-bottom: 48px;
  animation: fadeUp .6s .1s ease both;
}

/* Segmented control */
.mode-toggle {
  display: flex;
  background: var(--warm);
  border-radius: var(--r-pill);
  padding: 3px;
  width: min(440px, 100%);
  margin-bottom: 14px;
  gap: 3px;
  animation: fadeUp .6s .2s ease both;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.06);
}

.mode-btn {
  flex: 1;
  padding: 10px 0;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: none;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: all .18s cubic-bezier(.34,1.56,.64,1);
}
.mode-btn.active {
  background: #fff;
  color: var(--ink);
  box-shadow: var(--shadow-xs), 0 0 0 1px rgba(0,0,0,.06);
}
.mode-btn:not(.active):hover { color: var(--ink2); }

/* Inputs */
.input-area {
  width: min(440px, 100%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
  animation: fadeUp .6s .3s ease both;
}

.brand-input {
  width: 100%;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--ink);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
  box-shadow: var(--shadow-xs);
}
.brand-input:focus {
  border-color: var(--saffron);
  box-shadow: 0 0 0 3px rgba(232,100,42,.12);
}
.brand-input::placeholder { color: var(--light); }

.input-row { display: flex; gap: 8px; align-items: center; }
.input-row .brand-input { flex: 1; }

.remove-btn {
  width: 36px; height: 36px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--r-pill);
  color: var(--light);
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .18s;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-xs);
}
.remove-btn:hover { color: var(--coral); border-color: var(--coral); }

.add-brand {
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  color: var(--muted);
  background: #fff;
  border: 1.5px dashed var(--border);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  cursor: pointer;
  width: 100%;
  transition: all .18s;
  display: none;
  text-align: left;
}
.add-brand:hover { border-color: var(--saffron); color: var(--saffron); background: #FFF7F4; }
.add-brand.visible { display: block; }

/* Primary CTA */
.go-btn {
  width: min(440px, 100%);
  background: var(--saffron);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 15px;
  font-family: 'Libre Baskerville', serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: all .2s;
  letter-spacing: .01em;
  box-shadow: var(--shadow-saffron);
  animation: fadeUp .6s .35s ease both;
}
.go-btn:hover {
  background: var(--saffron2);
  box-shadow: 0 6px 20px rgba(232,100,42,.4);
  transform: translateY(-1px);
}
.go-btn:active { transform: translateY(0); box-shadow: var(--shadow-saffron); }
.go-btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; transform: none; }

.footer-note {
  margin-top: 40px;
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--border);
  text-align: center;
  animation: fadeUp .6s .4s ease both;
}

/* ─── APP ──────────────────────────────────── */
#app { display: none; min-height: 100vh; background: var(--surface); }

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 54px;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}

.app-logo {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--saffron);
  cursor: pointer;
  transition: opacity .18s;
}
.app-logo:hover { opacity: .7; }

.header-actions { display: flex; gap: 4px; align-items: center; }

.header-tab {
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  background: none; border: none;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  transition: all .18s;
}
.header-tab:hover { color: var(--ink); background: var(--warm); }
.header-tab.on { color: var(--ink); background: var(--warm); }

.back-link {
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--r-pill);
  padding: 6px 16px;
  cursor: pointer;
  transition: all .18s;
  margin-left: 8px;
  box-shadow: var(--shadow-xs);
}
.back-link:hover { color: var(--ink); border-color: var(--line); }

.app-content { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }

/* ─── LOADING ──────────────────────────────── */
.loading-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 80px 0;
  gap: 20px;
}
.loading-wrap.on { display: flex; }

.spinner {
  width: 34px; height: 34px;
  border: 2.5px solid var(--border);
  border-top-color: var(--saffron);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

.loading-name {
  font-family: 'Libre Baskerville', serif;
  font-size: 19px;
  color: var(--ink);
}

.loading-step {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  animation: pulse 2s ease infinite;
}

/* ─── RESULTS ──────────────────────────────── */
#results { display: none; }

.brand-headline {
  font-family: 'Libre Baskerville', serif;
  font-size: clamp(32px, 5.5vw, 58px);
  font-weight: 700;
  line-height: 1.06;
  color: var(--ink);
  margin-bottom: 4px;
}

.brand-rule {
  width: 100%;
  height: 1px;
  background: var(--border);
  margin: 14px 0 28px;
  position: relative;
}
.brand-rule::before {
  content: '';
  position: absolute;
  left: 0; top: -.5px;
  height: 2px; width: 48px;
  background: var(--saffron);
}

.mode-label {
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

/* Thesis */
.thesis {
  background: #fff;
  border: 1.5px solid var(--border);
  border-left: 3px solid var(--saffron);
  border-radius: var(--r-sm);
  padding: 22px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-xs);
}
.thesis-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.thesis-text {
  font-family: 'Libre Baskerville', serif;
  font-size: 15.5px;
  font-style: italic;
  line-height: 1.65;
  color: var(--ink2);
}

/* Block */
.block {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
}
.block-head {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--warm);
}
.block-body {
  padding: 18px;
  font-size: 13.5px;
  line-height: 1.73;
  color: #444;
}
.block-body strong { color: var(--ink); font-weight: 500; }

/* Two-col */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}

/* S/W */
.sw-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
}
.sw-col { padding: 18px; }
.sw-col:first-child { border-right: 1px solid var(--border); }
.sw-head {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.sw-head.g { color: var(--sage); }
.sw-head.r { color: var(--coral); }
.sw-dot { width: 5px; height: 5px; border-radius: 50%; }
.sw-head.g .sw-dot { background: var(--sage); }
.sw-head.r .sw-dot { background: var(--coral); }
.sw-col ul { list-style: none; padding: 0; }
.sw-col li {
  font-size: 13px;
  line-height: 1.5;
  color: #444;
  padding: 7px 0;
  border-bottom: 1px solid var(--warm);
  display: flex; gap: 8px;
}
.sw-col li:last-child { border-bottom: none; }
.sw-col li::before {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  flex-shrink: 0;
  padding-top: 1px;
}
.sw-col.g li::before { content: '+'; color: var(--sage); }
.sw-col.r li::before { content: '−'; color: var(--coral); }

/* Reality */
.reality {
  border: 1.5px solid #F5C6C2;
  border-left: 3px solid var(--coral);
  background: #FFF9F8;
  border-radius: var(--r-sm);
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
}
.reality-head {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--coral);
  margin-bottom: 8px;
}
.reality-text { font-size: 13.5px; line-height: 1.73; color: #444; }
.reality-text strong { color: var(--ink); font-weight: 500; }

/* Scores */
.score-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--warm);
}
.score-row:last-child { border-bottom: none; }
.score-dim { font-size: 12.5px; color: #444; flex: 1; }
.score-track {
  width: 120px;
  height: 3px;
  background: var(--warm);
  border-radius: 2px;
  flex-shrink: 0;
  overflow: hidden;
}
.score-fill {
  height: 100%;
  background: var(--saffron);
  border-radius: 2px;
  width: 0;
  transition: width 1.1s cubic-bezier(.19,1,.22,1);
}
.score-val {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--gold);
  width: 30px;
  text-align: right;
  flex-shrink: 0;
}

/* Vocab */
.vocab-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.vocab-word {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: var(--r-pill);
  border: 1.5px solid;
  letter-spacing: .04em;
}
.vocab-word.own { background: var(--ink); color: #fff; border-color: var(--ink); }
.vocab-word.gen { background: transparent; color: var(--muted); border-color: var(--border); }
.vocab-legend {
  display: flex; gap: 14px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Brief */
.brief-row {
  display: flex;
  gap: 16px;
  padding: 11px 0;
  border-bottom: 1px solid var(--warm);
  font-size: 13px;
  line-height: 1.65;
  color: #444;
}
.brief-row:last-child { border-bottom: none; }
.brief-key {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  width: 120px;
  flex-shrink: 0;
  padding-top: 2px;
}
.brief-copy-btn {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: var(--sage);
  color: #fff;
  border: none;
  padding: 5px 14px;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: opacity .18s;
  float: right;
  box-shadow: 0 2px 8px rgba(42,100,72,.22);
}
.brief-copy-btn:hover { opacity: .8; }

/* Comparative */
.comp-note {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.73;
  margin-bottom: 24px;
  padding-left: 14px;
  border-left: 2px solid var(--saffron);
}

.comp-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
}
.comp-table th {
  font-family: 'Libre Baskerville', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  text-align: left;
  padding: 11px 16px;
  background: var(--warm);
  border-bottom: 1.5px solid var(--border);
  border-right: 1px solid var(--border);
}
.comp-table th:first-child {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
  width: 130px;
}
.comp-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.65;
  color: #444;
  vertical-align: top;
  background: #fff;
}
.comp-table td:first-child {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--warm);
}
.comp-table tr:last-child td { border-bottom: none; }
.comp-table td strong { color: var(--ink); font-weight: 500; }

/* White space */
.whitespace {
  background: var(--ink);
  color: #fff;
  border-radius: var(--r-md);
  padding: 28px 30px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);
}
.ws-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--saffron);
  margin-bottom: 10px;
}
.ws-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 21px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
  line-height: 1.2;
}
.ws-body { font-size: 13.5px; line-height: 1.73; color: rgba(255,255,255,.6); }
.ws-body strong { color: #fff; font-weight: 500; }

/* Verdict */
.verdict-row {
  display: flex;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--warm);
  align-items: baseline;
}
.verdict-row:last-child { border-bottom: none; }
.verdict-brand {
  font-family: 'Libre Baskerville', serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  width: 130px;
  flex-shrink: 0;
}
.verdict-text { font-size: 13px; color: #444; line-height: 1.6; }

/* Sources */
.sources {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.source-tag {
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: .05em;
  padding: 4px 10px;
  border: 1.5px solid var(--border);
  color: var(--muted);
  background: var(--warm);
  border-radius: var(--r-pill);
}

/* Error */
.error {
  border: 1.5px solid #F5C6C2;
  border-left: 3px solid var(--coral);
  background: #FFF9F8;
  border-radius: var(--r-sm);
  padding: 20px;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--coral);
  box-shadow: var(--shadow-xs);
}

/* ─── ANIMATIONS ───────────────────────────── */
@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.appear { animation: fadeIn .35s ease both; }

/* ─── RESPONSIVE ───────────────────────────── */
@media(max-width:640px){
  .two-col { grid-template-columns: 1fr; }
  .sw-grid { grid-template-columns: 1fr; }
  .sw-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
  .app-header { padding: 0 16px; }
  .app-content { padding: 28px 16px 60px; }
  .comp-table th:first-child, .comp-table td:first-child { display: none; }
}
</style>
</head>
<body>

<section id="app">
  <header class="app-header">
    <div class="app-logo" onclick="goHome()">Brand Baaja Baraat</div>
    <div class="header-actions">
      <button class="header-tab on" id="ht-single" onclick="setModeApp('single')">Single</button>
      <button class="header-tab" id="ht-compare" onclick="setModeApp('compare')">Compare</button>
      <button class="back-link" onclick="goHome()">← Home</button>
    </div>
  </header>

  <div class="app-content">
    <!-- Loading -->
    <div class="loading-wrap" id="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-name" id="loading-name">—</div>

  </div>

<script>
/* ════════════════════════════════
   CONFIG
════════════════════════════════ */

let mode    = 'single';
let nFields = 1;

/* ════════════════════════════════
   MODE
════════════════════════════════ */
function setMode(m) {
  mode = m;
  document.getElementById('btn-single').classList.toggle('active', m === 'single');
  document.getElementById('btn-compare').classList.toggle('active', m === 'compare');
  resetFields();
}

function setModeApp(m) {
  mode = m;
  document.getElementById('ht-single').classList.toggle('on', m === 'single');
  document.getElementById('ht-compare').classList.toggle('on', m === 'compare');
  resetFields();
  resetResults();
}

function resetFields() {
  nFields = 1;
  const area = document.getElementById('input-area');
  area.innerHTML = `<input class="brand-input" type="text" id="b1"
    placeholder="${mode === 'single' ? 'Enter a brand name…' : 'Brand 1 — e.g. Zomato'}">`;
  const addBtn = document.getElementById('add-brand-btn');
  if (addBtn) addBtn.classList.toggle('visible', mode === 'compare');
  document.getElementById('go-btn').textContent = mode === 'single' ? 'Analyse →' : 'Compare →';
}

function addField() {
  if (nFields >= 4) return;
  nFields++;
  const area = document.getElementById('input-area');
  const row  = document.createElement('div');
  row.className = 'input-row';
  row.id = `row-${nFields}`;
  row.innerHTML = `
    <input class="brand-input" type="text" id="b${nFields}" placeholder="Brand ${nFields}">
    <button class="remove-btn" onclick="removeField(${nFields})">×</button>`;
  area.appendChild(row);
  if (nFields >= 4) document.getElementById('add-brand-btn').classList.remove('visible');
}

function removeField(n) {
  const row = document.getElementById(`row-${n}`);
  if (row) row.remove();
  nFields--;
  document.getElementById('add-brand-btn').classList.add('visible');
}

/* ════════════════════════════════
   NAV
════════════════════════════════ */
function goHome() {
  document.getElementById('landing').style.display = 'flex';
  document.getElementById('app').style.display     = 'none';
  resetResults();
}

function resetResults() {
  document.getElementById('loading-wrap').classList.remove('on');
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';
}

/* ════════════════════════════════
   LOADING
════════════════════════════════ */
const STEPS = [
  'Pulling brand intelligence…',
  'Scanning communication touchpoints…',
  'Reading consumer signals…',
  'Mapping category position…',
  'Synthesising the analysis…'
];
let stepTimer;

function startLoading(names) {
  document.getElementById('loading-name').textContent = names.join(' · ');
  document.getElementById('loading-wrap').classList.add('on');
  document.getElementById('results').style.display = 'none';
  let i = 0;
  document.getElementById('loading-step').textContent = STEPS[0];
  stepTimer = setInterval(() => {
    i = (i + 1) % STEPS.length;
    document.getElementById('loading-step').textContent = STEPS[i];
  }, 2200);
}

function stopLoading() {
  clearInterval(stepTimer);
  document.getElementById('loading-wrap').classList.remove('on');
}

/* ════════════════════════════════
   PROMPTS
════════════════════════════════ */
function promptSingle(brand) {
  return `You are a world-class brand strategist. Conduct a deep brand intelligence study on: "${brand}".
Respond ONLY with valid JSON. No markdown, no backticks, no explanation.
{
  "brand": "${brand}",
  "thesis": "One sharp italicised sentence — the brand's core idea in their own spirit",
  "what_they_say": "Communication style, tone, key messages, campaigns — be specific",
  "why_they_exist": "Founding philosophy and driving purpose",
  "who_they_speak_to": "Target consumer — who and why",
  "when_consumer_buys": "The exact trigger moment for purchase",
  "aspiration_solved": "The deeper human aspiration beneath the functional need",
  "category_of_one": "What makes them genuinely unreplicable",
  "strengths": ["s1","s2","s3","s4","s5"],
  "weaknesses": ["w1","w2","w3","w4"],
  "consumer_reality_check": "Honest gap between brand claim and real consumer experience",
  "scores": {
    "Communication Clarity": 7,
    "Emotional Resonance": 8,
    "Category Distinctiveness": 9,
    "Consumer Trust": 6,
    "Aspiration Power": 8
  },
  "vocabulary": {
    "owned": ["word1","word2","word3","word4","word5"],
    "shared": ["word1","word2","word3"]
  },
  "brief": {
    "target_consumer": "...",
    "message_hierarchy": "...",
    "what_to_say": "...",
    "what_never_to_say": "..."
  },
  "sources": ["Source 1","Source 2","Source 3","Source 4"]
}
Scores out of 10. Be analytically sharp. Use real campaigns, quotes, examples.`;
}

function promptCompare(brands) {
  const bl   = brands.map(b => `"${b}"`).join(', ');
  const bobj = brands.map(b => `"${b}": "..."`).join(', ');
  return `You are a world-class brand strategist. Comparative brand intelligence: ${brands.join(' vs ')}.
Respond ONLY with valid JSON. No markdown, no backticks.
{
  "brands": [${bl}],
  "intro": "2-3 sentences on what makes this comparison revealing",
  "comparison": {
    "What they say & how": { ${bobj} },
    "Why they exist": { ${bobj} },
    "Who they speak to": { ${bobj} },
    "When consumer buys": { ${bobj} },
    "Aspiration solved": { ${bobj} },
    "Category-of-one insight": { ${bobj} }
  },
  "white_space": {
    "title": "Name for the unclaimed territory",
    "body": "Specific opportunity no brand in this set owns"
  },
  "verdict": { ${bobj} },
  "sources": ["Source 1","Source 2","Source 3","Source 4"]
}`;
}

/* ════════════════════════════════
   RENDER SINGLE
════════════════════════════════ */
function renderSingle(d) {
  const dims = ['Communication Clarity','Emotional Resonance','Category Distinctiveness','Consumer Trust','Aspiration Power'];
  const cells = [
    ['What they say & how', d.what_they_say],
    ['Why they exist',      d.why_they_exist],
    ['Who they speak to',   d.who_they_speak_to],
    ['When consumer buys',  d.when_consumer_buys],
    ['Aspiration solved',   d.aspiration_solved],
    ['Category-of-one',     d.category_of_one],
  ];

  const scoreBars = dims.map(dm => {
    const v = d.scores?.[dm] ?? 5;
    return `<div class="score-row">
      <div class="score-dim">${dm}</div>
      <div class="score-track"><div class="score-fill" data-w="${v*10}%"></div></div>
      <div class="score-val">${v}/10</div>
    </div>`;
  }).join('');

  const ownWords = (d.vocabulary?.owned||[]).map(w => `<span class="vocab-word own">${e(w)}</span>`).join('');
  const genWords = (d.vocabulary?.shared||[]).map(w => `<span class="vocab-word gen">${e(w)}</span>`).join('');

  const briefRows = [
    ['Target Consumer',    d.brief?.target_consumer],
    ['Message Hierarchy',  d.brief?.message_hierarchy],
    ['Say This',           d.brief?.what_to_say],
    ['Never Say',          d.brief?.what_never_to_say],
  ];
  const briefText = briefRows.map(([k,v]) => `${k}:
${v}`).join('

/* ════════════════════════════════
   RENDER COMPARE
════════════════════════════════ */
function renderCompare(d) {
  const brands = d.brands || [];
  const dims   = Object.keys(d.comparison || {});

  const tableRows = dims.map(dm => `
    <tr>
      <td>${dm}</td>
      ${brands.map(b => `<td>${e(d.comparison[dm]?.[b]||'—')}</td>`).join('')}
    </tr>`).join('');

  const verdicts = brands.map(b => `
    <div class="verdict-row">
      <div class="verdict-brand">${e(b)}</div>
      <div class="verdict-text">${e(d.verdict?.[b]||'—')}</div>
    </div>`).join('');

  const html = `
    <div class="mode-label">Comparative Analysis</div>
    <div class="brand-headline">${brands.map(e).join(' <span style="font-size:0.5em;color:var(--saffron)"> vs </span> ')}</div>
    <div class="brand-rule"></div>

    <p class="comp-note">${e(d.intro||'')}</p>

    <table class="comp-table" style="margin-bottom:16px">
      <thead>
        <tr>
          <th>Dimension</th>
          ${brands.map(b=>`<th>${e(b)}</th>`).join('')}
        </tr>
      </thead>
      <tbody>${tableRows}</tbody>
    </table>

    <div class="whitespace">
      <div class="ws-label">White Space Opportunity</div>
      <div class="ws-title">${e(d.white_space?.title||'')}</div>
      <div class="ws-body">${e(d.white_space?.body||'')}</div>
    </div>

    <div class="block">
      <div class="block-head">Verdicts</div>
      <div class="block-body" style="padding:0 18px">${verdicts}</div>
    </div>

    <div class="sources">${(d.sources||[]).map(s=>`<span class="source-tag">${e(s)}</span>`).join('')}</div>
  `;

  show(html);
}

/* ════════════════════════════════
   RUNNER
════════════════════════════════ */
async function runAnalysis() {
  const brands = [];
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById(`b${i}`);
    if (el && el.value.trim()) brands.push(el.value.trim());
  }
  if (!brands.length) return;
  if (mode === 'compare' && brands.length < 2) {
    alert('Please enter at least 2 brands to compare.'); return;
  }

  // Switch to app view
  document.getElementById('landing').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('ht-single').classList.toggle('on', mode === 'single');
  document.getElementById('ht-compare').classList.toggle('on', mode === 'compare');

  startLoading(brands);
  document.getElementById('go-btn').disabled = true;

  const prompt = mode === 'single' ? promptSingle(brands[0]) : promptCompare(brands);

  try {
    const res = await fetch('https://bbb-backend.vercel.app/api/analyse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, mode })
    });

    stopLoading();
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (mode === 'single') renderSingle(data.result);
    else                   renderCompare(data.result);

  } catch (err) {
    stopLoading();
    show(`<div class="error">
      <strong>Analysis failed.</strong><br><br>
      ${e(err.message)}
    </div>`);
  }

  document.getElementById('go-btn').disabled = false;
}

/* ════════════════════════════════
   UTILS
════════════════════════════════ */
function show(html) {
  const el = document.getElementById('results');
  el.innerHTML = html;
  el.style.display = 'block';
  el.classList.add('appear');
  setTimeout(() => {
    el.querySelectorAll('.score-fill[data-w]').forEach(f => {
      f.style.width = f.dataset.w;
    });
  }, 100);
}

function e(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => {
    document.querySelectorAll('.brief-copy-btn').forEach(b => {
      b.textContent = 'Copied!';
      setTimeout(() => { b.textContent = 'Copy'; }, 1600);
    });
  });
}

</script>
